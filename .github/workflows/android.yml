name: Android validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests, lint, R8, and 16 KiB alignment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK prerequisites
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Validate Gradle wrapper and project configuration
        run: |
          ./gradlew --version
          ./gradlew tasks --all

      - name: JVM tests
        run: ./gradlew testDebugUnitTest

      - name: Full Gradle test lifecycle
        run: ./gradlew test

      - name: Android lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Compile unsigned minified release validation variant
        run: ./gradlew assembleReleaseValidation

      - name: Verify 16 KiB APK/native-library alignment
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          python3 scripts/verify-16k-apk.py "$apk"
